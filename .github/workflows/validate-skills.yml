name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check generated references
        run: python3 scripts/sync_shared_references.py --check
      - name: Validate skills
        run: python3 scripts/validate_skills.py
      - name: Validate evaluation plans
        run: |
          python3 scripts/run_skill_evals.py --skill box-cli --plan > /tmp/box-cli-plan.json
          python3 scripts/run_skill_evals.py --skill box-mcp --plan > /tmp/box-mcp-plan.json
      - name: Smoke-test evaluation adapter protocol
        run: |
          python3 scripts/run_skill_evals.py --skill box-cli --repetitions 1 --runner "python3 evals/fixtures/mock_runner.py" --output /tmp/box-cli-smoke.json
          python3 scripts/run_skill_evals.py --skill box-mcp --repetitions 1 --runner "python3 evals/fixtures/mock_runner.py" --output /tmp/box-mcp-smoke.json
